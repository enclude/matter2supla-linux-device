<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matter2Supla — logowanie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%230b7a53'/%3E%3Cpath d='M4 12V4.6l4 4.6 4-4.6V12' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { --bg: #f4f5f2; --card: #ffffff; --ink: #1c2321; --muted: #66706c; --line: #dfe3de; --accent: #0b7a53; --accent-ink: #ffffff; --bad: #a3271f; --bad-bg: #fdecea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141816; --card: #1d2320; --ink: #e8ece9; --muted: #98a39e; --line: #2e3632; --accent: #37b585; --accent-ink: #08130e; --bad: #ff8f85; --bad-bg: #3a1a17; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input { font: inherit; width: 100%; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button { font: inherit; font-weight: 600; width: 100%; margin-top: 14px; padding: 9px 12px; border-radius: 7px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; font-size: 13px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Matter2Supla</h1>
  <p>Podaj hasło panelu.</p>
  <!--ERROR-->
  <label for="password">Hasło</label>
  <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
  <button>Zaloguj</button>
</form>
</body>
</html>
