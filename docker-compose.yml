# Stos Matter over Thread -> SUPLA. Wszystko w sieci hosta (Matter wymaga IPv6, multicastu i mDNS).
# Uruchamiać na prawdziwym Linuksie (Raspberry Pi, mini-PC, VM z mostkowaną kartą), nie w WSL2.

# Logi kontenerów z limitem rozmiaru: bez tego rosną bez końca i niepotrzebnie zużywają nośnik
# (istotne zwłaszcza przy karcie SD).
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  otbr:
    image: openthread/border-router:latest
    container_name: otbr
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - "${RCP_DEVICE:-/dev/thread-rcp}:/dev/ttyRCP"
      - "/dev/net/tun"
    environment:
      # uart-init-deassert: bez tego otwarcie portu ustawia DTR/RTS i układ auto-resetu płytki
      # wprowadza ESP32 w tryb programowania — OTBR nie widzi wtedy RCP (sprawdzone na CH340).
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyRCP?uart-baudrate=${RCP_BAUDRATE:-460800}&uart-init-deassert"
      OT_INFRA_IF: "${INFRA_IF:?ustaw INFRA_IF w pliku .env}"
      OT_THREAD_IF: "wpan0"
      OT_LOG_LEVEL: "5"
      # REST (8081) i panel WWW (8080) nasłuchują domyślnie tylko na 127.0.0.1 — tak ma zostać.
    volumes:
      - "./data/otbr:/data"
    logging: *logging
    restart: unless-stopped

  matter-server:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    network_mode: host
    read_only: true
    environment:
      LISTEN_ADDRESS: "127.0.0.1"        # WebSocket i dashboard tylko lokalnie (z LAN: tunel SSH)
      PRIMARY_INTERFACE: "${INFRA_IF}"
      TZ: "${TZ:-Europe/Warsaw}"
    volumes:
      - "./data/matter:/data"            # dane fabric — sekret, kopia zapasowa! (właściciel: uid 1000)
    logging: *logging
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    network_mode: host
    volumes:
      - "./config/mosquitto:/mosquitto/config:ro"
    logging: *logging
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: bridge
    network_mode: host
    environment:
      SUPLA_SERVER: "${SUPLA_SERVER:-}"
      SUPLA_MAIL: "${SUPLA_MAIL:-}"
      M2S_WEB_PASSWORD: "${M2S_WEB_PASSWORD:-}"   # wymagane, gdy panel WWW ma być dostępny z LAN
    volumes:
      - "./config:/config"                    # łącznik zapisuje tu devices.yaml i supla/ (uid 1000)
      - "./backups:/backups:ro"               # kopie zapasowe do pobrania z panelu (host/backup.sh)
    depends_on: [mqtt, matter-server]
    logging: *logging
    restart: unless-stopped

  supla:
    build: ./supla-device
    container_name: supla
    network_mode: host
    volumes:
      - "./config/supla:/etc/supla-device:ro"
      - "./data/supla:/var/lib/supla-device"   # GUID/AUTHKEY — sekret, kopia zapasowa! (uid 1000)
    depends_on: [mqtt, bridge]
    logging: *logging
    restart: unless-stopped
