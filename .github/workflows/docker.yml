# Buduje obrazy `bridge` i `supla-device` dla amd64 i arm64 i publikuje je w GitHub Container
# Registry (ghcr.io). Dzięki temu instalacja pobiera gotowe obrazy zamiast kompilować je na
# Raspberry Pi.
#
# Tagi obrazów:
#   tag gita `vX.Y.Z`  -> `X.Y.Z` i `latest` oraz wydanie (GitHub Release) z automatycznymi notatkami,
#   gałąź `main`       -> `edge` i `sha-<commit>` (wersja rozwojowa, nie `latest`),
#   pull request       -> sama budowa, bez publikacji.
# Wersja i commit są wbudowane w oba obrazy (M2S_BUILD_VERSION, M2S_BUILD_REVISION).
# Filtr `paths` dotyczy gałęzi i pull requestów; wypchnięcie tagu uruchamia pipeline zawsze.
name: Obrazy Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "bridge/**"
      - "supla-device/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "supla-device/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/matter2supla

jobs:
  test:
    name: Testy łącznika
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja
        working-directory: bridge
        run: pip install -e ".[dev]"
      - name: Testy
        working-directory: bridge
        run: python -m pytest -q

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: test
    # Natywne maszyny dla każdej architektury: kompilacja supla-device pod emulacją trwałaby
    # wielokrotnie dłużej.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [bridge, supla-device]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Wersja
        id: version
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="edge"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Logowanie do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Budowa i publikacja
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          # Tag tymczasowy dla jednej architektury; wspólny tag powstaje w zadaniu `manifest`.
          # Numer przebiegu w nazwie: ten sam commit bywa budowany dwa razy (gałąź i tag) z inną wersją.
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:build-${{ github.run_id }}-${{ matrix.arch }}
          build-args: |
            M2S_BUILD_VERSION=${{ steps.version.outputs.version }}
            M2S_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: false

  manifest:
    name: ${{ matrix.image }} (wspólny tag)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [bridge, supla-device]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tagi wynikowe
        id: tags
        run: |
          NAME="${IMAGE_PREFIX}-${{ matrix.image }}"
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FIRST="${GITHUB_REF_NAME#v}"
            TAGS="-t ${NAME}:${FIRST} -t ${NAME}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            FIRST="edge"
            TAGS="-t ${NAME}:edge -t ${NAME}:sha-${GITHUB_SHA::7}"
          else
            # Ręczne uruchomienie z innej gałęzi albo tag spoza schematu vX.Y.Z: tylko tag commita.
            FIRST="sha-${GITHUB_SHA::7}"
            TAGS="-t ${NAME}:${FIRST}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "first=${FIRST}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Złożenie obrazu wieloarchitekturowego
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} \
            "${{ steps.tags.outputs.name }}:build-${GITHUB_RUN_ID}-amd64" \
            "${{ steps.tags.outputs.name }}:build-${GITHUB_RUN_ID}-arm64"
          docker buildx imagetools inspect "${{ steps.tags.outputs.name }}:${{ steps.tags.outputs.first }}"

  release:
    name: Wydanie
    # Dopiero po opublikowaniu obrazów: panel i host/update.sh dowiadują się o wersji z listy wydań.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Utworzenie wydania z automatycznymi notatkami
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} nie ma postaci vX.Y.Z — bez wydania."
            exit 0
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Wydanie ${GITHUB_REF_NAME} już istnieje."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
