# Buduje obrazy `bridge` i `supla-device` dla amd64 i arm64 i publikuje je w GitHub Container
# Registry (ghcr.io). Dzięki temu instalacja pobiera gotowe obrazy zamiast kompilować je na
# Raspberry Pi.
#
# Tagi: `latest` dla gałęzi main, numer wersji dla tagów `v*` (np. v1.2.0 -> 1.2.0).
name: Obrazy Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "bridge/**"
      - "supla-device/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "supla-device/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/matter2supla

jobs:
  test:
    name: Testy łącznika
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja
        working-directory: bridge
        run: pip install -e ".[dev]"
      - name: Testy
        working-directory: bridge
        run: python -m pytest -q

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: test
    # Natywne maszyny dla każdej architektury: kompilacja supla-device pod emulacją trwałaby
    # wielokrotnie dłużej.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [bridge, supla-device]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Logowanie do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Budowa i publikacja
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          # Tag tymczasowy dla jednej architektury; wspólny tag powstaje w zadaniu `manifest`.
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: false

  manifest:
    name: ${{ matrix.image }} (wspólny tag)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [bridge, supla-device]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tagi wynikowe
        id: tags
        run: |
          NAME="${IMAGE_PREFIX}-${{ matrix.image }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="-t ${NAME}:${GITHUB_REF_NAME#v}"
          else
            TAGS="-t ${NAME}:latest"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS} -t ${NAME}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Złożenie obrazu wieloarchitekturowego
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} \
            "${{ steps.tags.outputs.name }}:build-${GITHUB_SHA}-amd64" \
            "${{ steps.tags.outputs.name }}:build-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${{ steps.tags.outputs.name }}:sha-${GITHUB_SHA::7}"
